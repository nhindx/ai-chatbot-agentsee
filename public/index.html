<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AI Chat - Agent SEE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#0a0f1a;color:#e2e8f0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.header{background:#111827;border-bottom:1px solid #1e293b;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header .left{display:flex;align-items:center;gap:10px}.header .left span{font-weight:600;font-size:16px}
.header .right{display:flex;align-items:center;gap:10px;font-size:13px}
.badge{background:#f59e0b;color:#000;padding:2px 8px;border-radius:4px;font-weight:700;font-size:11px}
.logout-btn{background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
.rate-info{background:#1e293b;padding:4px 10px;border-radius:6px;font-size:12px;color:#94a3b8}
.login-box{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:16px;padding:20px}
.login-box h2{font-size:22px;margin-bottom:8px}.login-box p{color:#94a3b8;font-size:14px}
.login-box input{width:320px;padding:12px;background:#1a2332;border:1px solid #1e293b;border-radius:8px;color:#e2e8f0;font-size:14px;outline:none}
.login-box input:focus{border-color:#10b981}
.login-box button{padding:12px 32px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.login-box .err{color:#ef4444;font-size:13px;min-height:20px}
.main-content{flex:1;display:flex;overflow:hidden}
.profile-panel{width:400px;min-width:400px;background:#111827;border-right:1px solid #1e293b;display:flex;flex-direction:column;align-items:center;padding:24px;gap:16px;flex-shrink:0}
.profile-panel .avatar-wrap{width:300px;height:300px;border-radius:12px;overflow:hidden;border:3px solid #10b981;background:#1e293b;flex-shrink:0}
.profile-panel .avatar-wrap img{width:300px;height:300px;object-fit:cover;display:block}
.profile-panel .pname{font-size:22px;font-weight:700;color:#fff;text-align:center}
.profile-panel .prole{font-size:14px;color:#94a3b8;background:#1e293b;padding:6px 14px;border-radius:6px}
.submit-btn{margin-top:auto;padding:14px 28px;background:#f59e0b;color:#000;border:none;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.submit-msg{font-size:13px;min-height:20px;text-align:center;word-break:break-word}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;max-width:80%}.msg.u{align-self:flex-end;flex-direction:row-reverse}
.msg .av{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.msg.b .av{background:#10b981}.msg.u .av{background:#3b82f6}
.msg .bb{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
.msg.b .bb{background:#1e293b;border-top-left-radius:2px}.msg.u .bb{background:#164e3a;border-top-right-radius:2px}
.input-area{background:#111827;border-top:1px solid #1e293b;padding:12px 16px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.input-area textarea{flex:1;padding:10px;background:#0d1520;border:1px solid #1e293b;border-radius:8px;color:#e2e8f0;font-family:inherit;font-size:14px;resize:none;min-height:42px;max-height:120px;outline:none}
.input-area button{width:42px;height:42px;background:#10b981;border:none;border-radius:8px;color:#fff;font-size:16px;cursor:pointer;flex-shrink:0}
.input-area button:disabled{opacity:.3;cursor:not-allowed}
.guest-limit{text-align:center;padding:20px;color:#f59e0b;font-size:14px}
.guest-limit button{margin-top:8px;padding:8px 20px;background:#10b981;color:#fff;border:none;border-radius:6px;cursor:pointer}
.admin-bar{background:#1a2332;border-top:1px solid #1e293b;padding:8px 16px;display:flex;gap:12px;align-items:center;font-size:12px;color:#94a3b8;flex-shrink:0}
.admin-bar button{background:#374151;color:#e2e8f0;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:12px}
.hidden{display:none!important}
</style></head><body>
<div class="header"><div class="left">&#129302; <span>AI Chat</span></div><div class="right" id="hdr-right"><span class="rate-info" id="rate-display">Han muc: 3/3 luot</span></div></div>
<div class="login-box" id="login-box"><h2>&#128274; Dang nhap</h2><p>Login bang token lop Agent SEE</p><input id="token-input" placeholder="Nhap token..." autocomplete="off"><button onclick="doLogin()">Dang nhap</button><div class="err" id="login-err"></div><p style="font-size:12px;color:#64748b;margin-top:12px">Hoac <a href="#" onclick="skipLogin();return false;" style="color:#10b981">dung thu khong can dang nhap</a> (gioi han 3 tin nhan)</p></div>
<div class="main-content hidden" id="main-content">
<div class="profile-panel hidden" id="profile-panel">
<div class="avatar-wrap"><img id="avatar-img" src="" alt="Avatar" crossorigin="anonymous"></div>
<div class="pname" id="p-name"></div>
<div class="prole" id="p-role">Member</div>
<button class="submit-btn" id="submit-btn" onclick="submitBai()" disabled>&#128230; Nop bai ho ban</button>
<div class="submit-msg" id="submit-msg">Dang tai avatar...</div>
</div>
<div class="chat-area" id="chat-area">
<div class="msgs" id="msgs"></div>
<div class="guest-limit hidden" id="guest-limit">&#9888;&#65039; Het luot dung thu. <button onclick="showLogin()">Dang nhap de tiep tuc</button></div>
<div class="admin-bar hidden" id="admin-bar"><button onclick="clearHistory()">&#128465; Xoa lich su</button><span id="stats"></span></div>
<div class="input-area" id="input-area"><textarea id="ci" rows="1" placeholder="Nhap cau hoi..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button id="sb" onclick="send()">&#10148;</button></div>
</div>
</div>
<script>
let user=null,hist=[],busy=false,loginCount=parseInt(localStorage.getItem('login_count')||'0'),avatarLoaded=false;
const OWNER_TOKEN='a851a78f20a6b6559b12e6a455c665b5';
const LOGIN_API='https://trangden.vn/agentsee/api/bai-tap/3285/'+OWNER_TOKEN+'/tuan-1/bai-6/cau-6/login';
const SUBMIT_API='https://trangden.vn/agentsee/api/bai-tap/3285/'+OWNER_TOKEN+'/tuan-1/bai-6/cau-8/submit';
const MAX_RATE=3,RATE_WINDOW=3600000;
function getRateData(){const d=JSON.parse(localStorage.getItem('rate_data')||'{"times":[]}');d.times=d.times.filter(t=>Date.now()-t<RATE_WINDOW);localStorage.setItem('rate_data',JSON.stringify(d));return d}
function getRateLeft(){return MAX_RATE-getRateData().times.length}
function useRate(){const d=getRateData();d.times.push(Date.now());localStorage.setItem('rate_data',JSON.stringify(d))}
function updateRateDisplay(){const el=document.getElementById('rate-display');if(!el)return;const left=getRateLeft();el.textContent='Han muc: '+left+'/'+MAX_RATE+' luot (1 tieng)';el.style.color=left<=1?'#ef4444':'#94a3b8'}
function getGuestCount(){return parseInt(localStorage.getItem('guest_msg_count')||'0')}
function showLogin(){document.getElementById('login-box').classList.remove('hidden');document.getElementById('main-content').classList.add('hidden')}
function showChat(){document.getElementById('login-box').classList.add('hidden');document.getElementById('main-content').classList.remove('hidden');updateRateDisplay();updateAdmin();updateProfilePanel()}
function updateProfilePanel(){const pp=document.getElementById('profile-panel');if(user&&!user.admin){pp.classList.remove('hidden');document.getElementById('p-name').textContent=user.name;document.getElementById('p-role').textContent='Member';loadAvatar(user.avatar)}else{pp.classList.add('hidden')}}
function loadAvatar(avatarUrl){const img=document.getElementById('avatar-img');const btn=document.getElementById('submit-btn');const msg=document.getElementById('submit-msg');avatarLoaded=false;btn.disabled=true;msg.textContent='Dang tai avatar...';msg.style.color='#94a3b8';
if(!avatarUrl){msg.textContent='Khong co avatar';msg.style.color='#ef4444';return}
const proxyUrl='/api/avatar-proxy?url='+encodeURIComponent(avatarUrl);
img.onload=function(){avatarLoaded=true;btn.disabled=false;msg.textContent='San sang nop bai';msg.style.color='#10b981'};
img.onerror=function(){msg.textContent='Loi tai avatar';msg.style.color='#ef4444'};
img.src=proxyUrl}
function skipLogin(){user=null;showChat();if(getGuestCount()>=3)document.getElementById('guest-limit').classList.remove('hidden')}
async function doLogin(){const tk=document.getElementById('token-input').value.trim();const err=document.getElementById('login-err');if(!tk){err.textContent='Vui long nhap token';return}
err.textContent='Dang xac thuc...';try{const r=await fetch(LOGIN_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input_token:tk})});const d=await r.json();
if(d.success){user={name:d.display_name,admin:d.is_admin,token:tk,avatar:d.avatar_url||d.avatar||d.avatar_secret||''};loginCount++;localStorage.setItem('login_count',loginCount);showChat();updateHeader()}
else{err.textContent=d.error||'Token khong hop le'}}catch(e){err.textContent='Loi ket noi: '+e.message}}
function updateHeader(){const r=document.getElementById('hdr-right');if(user){let h='<span class="rate-info" id="rate-display"></span>';if(user.admin)h+='<span class="badge">ADMIN</span>';h+='<span>'+user.name+'</span><button class="logout-btn" onclick="logout()">Dang xuat</button>';r.innerHTML=h}else{r.innerHTML='<span class="rate-info" id="rate-display">Han muc: 3/3 luot</span>'}updateRateDisplay()}
function logout(){user=null;hist=[];avatarLoaded=false;document.getElementById('msgs').innerHTML='';document.getElementById('avatar-img').src='';document.getElementById('profile-panel').classList.add('hidden');updateHeader();showLogin()}
function updateAdmin(){const bar=document.getElementById('admin-bar');if(user&&user.admin){bar.classList.remove('hidden');document.getElementById('stats').textContent='Tong tin: '+hist.length+' | Luot login: '+loginCount}else bar.classList.add('hidden')}
function clearHistory(){hist=[];document.getElementById('msgs').innerHTML='';updateAdmin()}
function addMsg(role,text){const d=document.createElement('div');d.className='msg '+(role==='b'?'b':'u');const t=text.replace(/</g,'&lt;').replace(/\n/g,'<br>');d.innerHTML='<div class="av">'+(role==='b'?'&#129302;':'&#128100;')+'</div><div class="bb">'+t+'</div>';document.getElementById('msgs').appendChild(d);document.getElementById('msgs').scrollTop=9e9;updateAdmin()}
async function send(){if(busy)return;const ci=document.getElementById('ci');const v=ci.value.trim();if(!v)return;
if(!user&&getGuestCount()>=3){document.getElementById('guest-limit').classList.remove('hidden');return}
if(getRateLeft()<=0){alert('Da het han muc '+MAX_RATE+' luot/tieng.');return}
ci.value='';addMsg('u',v);hist.push({role:'user',content:v});
if(!user){localStorage.setItem('guest_msg_count',getGuestCount()+1);if(getGuestCount()>=3)document.getElementById('guest-limit').classList.remove('hidden')}
useRate();updateRateDisplay();busy=true;document.getElementById('sb').disabled=true;
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist})});const d=await r.json();
if(d.reply){addMsg('b',d.reply);hist.push({role:'assistant',content:d.reply})}else addMsg('b','\u26a0\ufe0f '+(d.error||'Loi'))}catch(e){addMsg('b','\u26a0\ufe0f Loi ket noi')}
busy=false;document.getElementById('sb').disabled=false;ci.focus()}
async function submitBai(){if(!user||user.admin||!avatarLoaded)return;const btn=document.getElementById('submit-btn');const msg=document.getElementById('submit-msg');btn.disabled=true;msg.textContent='Dang chup man hinh...';msg.style.color='#94a3b8';
window.scrollTo(0,0);await new Promise(r=>setTimeout(r,300));
try{const canvas=await html2canvas(document.body,{useCORS:true,allowTaint:false,backgroundColor:'#0a0f1a',scale:1,logging:false,width:document.body.offsetWidth,height:document.body.offsetHeight,windowWidth:document.body.offsetWidth,windowHeight:document.body.offsetHeight});
msg.textContent='Dang nop bai...';
const blob=await new Promise(r=>canvas.toBlob(r,'image/png',0.95));
if(!blob){throw new Error('Khong tao duoc anh')}
const fd=new FormData();fd.append('screenshot',blob,'screenshot.png');fd.append('owner_token',OWNER_TOKEN);fd.append('visitor_token',user.token);
const r=await fetch(SUBMIT_API,{method:'POST',body:fd});const d=await r.json();
if(d.success){msg.textContent='\u2705 Da nop bai thanh cong!';msg.style.color='#10b981'}else{msg.textContent='\u274c '+(d.error||'Loi nop bai');msg.style.color='#ef4444'}}catch(e){msg.textContent='\u274c Loi: '+e.message;msg.style.color='#ef4444'}
btn.disabled=false}
document.getElementById('token-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
updateRateDisplay();
</script></body></html>
